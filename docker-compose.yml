services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: alegra
      POSTGRES_PASSWORD: alegra_secret
      POSTGRES_DB: alegra_festas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alegra -d alegra_festas']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backup automático do Postgres: pg_dump em formato custom (-Fc, permite
  # restore seletivo/paralelo) a cada 24h, retendo os últimos 7 dias.
  #
  # Como restaurar um dump (ambiente já provisionado, contêiner `postgres`
  # rodando):
  #   1. Copie o dump do volume para fora do contêiner, se necessário:
  #        docker compose cp backup:/backups/alegra_YYYYMMDD_HHMM.dump ./
  #   2. Restaure por cima do banco atual (--clean derruba objetos existentes
  #      antes de recriá-los; use com cuidado — é destrutivo para o estado
  #      atual do schema/dados):
  #        docker compose exec -T postgres pg_restore \
  #          -U alegra -d alegra_festas --clean --if-exists \
  #          < alegra_YYYYMMDD_HHMM.dump
  #      (ou, com o arquivo já dentro do volume `pgbackups`, rode o mesmo
  #      pg_restore de dentro do próprio serviço `backup`.)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: alegra_secret
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgbackups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "[backup] job started — dumping every 24h, retention 7 days"
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M)
          FILE="/backups/alegra_$${TIMESTAMP}.dump"
          echo "[backup] $$(date -Iseconds) starting dump -> $${FILE}"
          if pg_dump -h postgres -U alegra -d alegra_festas -Fc -f "$${FILE}"; then
            echo "[backup] $$(date -Iseconds) dump completed: $${FILE}"
          else
            echo "[backup] $$(date -Iseconds) dump FAILED for $${FILE}" >&2
          fi
          find /backups -name 'alegra_*.dump' -mtime +7 -delete
          sleep 86400
        done

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: aplica migrations pendentes ANTES do api subir. Usa o estágio
  # `builder` (que tem o Prisma CLI); em produção é exatamente `prisma
  # migrate deploy` — nunca `db push` (ver docs/migrations.md).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["yarn", "prisma", "migrate", "deploy"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alegra:alegra_secret@postgres:5432/alegra_festas?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # `yarn seed:samples` (ver prisma/seed-samples.ts) grava SVGs de
      # produto em public/uploads/products dentro deste container — sem o
      # MESMO volume nomeado do serviço `api`, os arquivos morreriam com o
      # container (`docker compose run --rm`) e o `api` nunca os veria,
      # gerando URLs de imagem 404 em produção. `prisma migrate deploy`
      # (comando padrão deste serviço) não grava nada aqui, então montar o
      # volume não muda o comportamento do `up` normal.
      - uploads:/app/public/uploads
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do compose os serviços se enxergam pelo nome do
      # serviço (postgres/redis), não por localhost — .env local costuma
      # apontar para localhost (uso fora de container), então sobrescrevemos
      # aqui só o necessário para a API falar com os outros serviços deste
      # compose. Ajuste connection_limit/pool_timeout junto com o comentário
      # em .env.example se mudar o pool do Prisma.
      DATABASE_URL: postgresql://alegra:alegra_secret@postgres:5432/alegra_festas?schema=public&connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      PORT: 3333
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Imagens de produto enviadas via POST /v1/admin/uploads/images ficam
      # em disco (ver src/app.ts, prefix /uploads) — precisa de um volume
      # nomeado para sobreviver a rebuilds/restarts do container.
      - uploads:/app/public/uploads
    # deploy:
    #   replicas: 3
    # Descomente para escalar horizontalmente. Múltiplas réplicas do mesmo
    # serviço não expõem a porta do host diretamente sem conflito — coloque
    # um proxy reverso/load balancer na frente da API para distribuir entre
    # as réplicas (fora deste compose; o front vai trazer o seu).

volumes:
  pgdata:
  pgbackups:
  redisdata:
  uploads:
